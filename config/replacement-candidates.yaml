version: 1
principle: "不为凑满100而保留重复模型；只有在跨公司回归测试中证明低独立增量信息后才正式替换。"
replacement_thresholds:
  co_selection_rate_min: 0.70
  same_evidence_rate_min: 0.60
  same_conclusion_rate_min: 0.70
  incremental_information_rate_max: 0.20
candidates:
  - name: "Goodhart's Law"
    cn: "古德哈特定律"
    priority: 5
    why: "审查KPI、激励、管理层目标和指标被游戏化。"
  - name: "Wright's Law / Experience Curve"
    cn: "赖特定律 / 经验曲线"
    priority: 5
    why: "制造业、半导体、电池、机器人等累计产量与单位成本下降的核心模型。"
  - name: "S-Curve / Diffusion of Innovation"
    cn: "S曲线 / 创新扩散"
    priority: 5
    why: "判断渗透率、增长阶段和成熟拐点。"
  - name: "Little's Law / Queueing Theory"
    cn: "利特尔法则 / 排队论"
    priority: 5
    why: "连接WIP、吞吐量、周期时间，适合制造、供应链和软件工程。"
  - name: "Reflexivity"
    cn: "反身性"
    priority: 4
    why: "证券价格、融资能力、基本面之间可能互相反馈。"
  - name: "Capital Cycle"
    cn: "资本周期"
    priority: 5
    why: "高利润吸引资本进入、扩产、供给过剩、ROIC回落；对周期行业极重要。"
  - name: "Explore–Exploit Tradeoff"
    cn: "探索—利用权衡"
    priority: 4
    why: "研发、新业务、资本配置中平衡现有优势与未来探索。"
  - name: "Power Law / Pareto Distribution"
    cn: "幂律 / 帕累托分布"
    priority: 4
    why: "客户、产品、内容、网络、风险贡献高度集中时比均值模型更合适。"
  - name: "Modularity / Loose Coupling"
    cn: "模块化 / 松耦合"
    priority: 3
    why: "分析产品架构、组织扩展、供应链替代性和系统韧性。"
potential_slots:
  - models: ["021","075"]
    reason: "Stock–Flow高度重复，优先候选合并。"
  - models: ["067","091"]
    reason: "路径依赖高度重叠，可能合并为通用模型+制度应用。"
  - models: ["044","087"]
    reason: "委托代理表述重复；更可能通过重新定义087而非删除。"
